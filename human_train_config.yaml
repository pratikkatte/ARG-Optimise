# Run from the repository root: python train.py --config human_train_config.yaml
# CLI options override these settings. Paths are relative to the working directory.
# Human simulation: eight haplotypes, each 2,000 bp long, from replicate 0.
dataset_path: validation/datasets/human_2kb_super_easy/rep0/human_2kb_super_easy.fa
output_path: runs/human_2kb_super_easy
epochs: 1000
batch_size: 64
seed: 7
verbose: true
wandb: true

# Retain the optimization and evaluation settings from config.yaml.
policy_lr: 0.0001
log_z_lr: 0.003
grad_clip: 10.0
grad_accum_steps: 1
init_z_sample_count: 16
eval_episodes: 128
eval_every: 10

# Match the simulation parameters recorded in rep0/metadata.json.
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.29e-8          # Per base per generation.
recombination_rate: 1.253e-8    # Per base per generation.
time_bins: 32
time_delta_bin_width: 0.001

# Retain the policy architecture from config.yaml.
embedding_size: 32
hidden_size: 64
dropout: 0.0
breakpoint_hidden_dim: 128
breakpoint_dropout: 0.1
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
attention_dropout: 0.0
