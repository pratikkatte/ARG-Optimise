# Human simulation preset using the human-rate assumptions in simulate_config.yaml.
# Run from the repository root:
#   python validation/scripts/merge_msprime.py --config validation/config/human_simulate.yaml
# Relative paths resolve from this YAML file's directory.
# Model: constant-size diploid population, uniform rates, and JC69 mutations.

dataset_name: human_2kb_super_easy
num_replicates: 1
num_samples: 8                 # Haplotypes: 8 = 4 diploid individuals; must be even.
population_size: 10000         # Effective diploid population size (Ne).
mutation_rate: 1.29e-8         # Mutations per base per generation.
recombination_rate: 1.253e-8    # Recombination rate per base per generation.
sequence_length: 2000         # Bases; increase for a longer simulated region.
seed: 42                      # Replicate i uses seed + i*100000; mutations use +1.
contig_id: "1"                # VCF contig label.

# Each replicate has its own folder, including a single replicate:
#   validation/datasets/<dataset_name>/rep0/<dataset_name>.{vcf,fa,trees}
#   validation/datasets/<dataset_name>/rep0/tcoalmap/<dataset_name>_spls0-1.tc
# Additional replicates use rep1/, rep2/, etc.
# Each replicate also includes metadata.json with counts, sites, breakpoints and settings.
# Rerunning with the same dataset name overwrites matching output files.
output_dir: ../datasets

# hg38 supplies nonvariant FASTA bases; simulated mutations use JC69.
# The reference window starts at this zero-based offset and spans sequence_length.
# Exported coordinates are local to the window.
# Missing/empty references are downloaded; set reference_url: null for local-only use.
reference_fasta: ../reference/hg38.fa.gz
reference_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz
reference_contig: chr1
reference_start: 10000000
