# Run from the repository root:
#   python validation/scripts/merge_msprime.py --config validation/config/simulate_config.yaml
# Without --config, the script uses this file regardless of working directory.
# Relative paths (including omitted path defaults) resolve from the YAML directory.
# Omitted settings use the defaults shown below; unknown settings are rejected.

# Dataset folder name and output filename stem, without an extension.
# One dataset is configured per file. Every replicate gets its own folder,
# including rep0/ when num_replicates is 1:
#   <output_dir>/<dataset_name>/rep0/<dataset_name>.{vcf,fa,trees}
#   <output_dir>/<dataset_name>/rep0/tcoalmap/<dataset_name>_spls0-1.tc
# Additional replicates use rep1/, rep2/, etc. with the same filenames.
# Each replicate also includes metadata.json with counts, sites, breakpoints and settings.
# Existing files with matching names are overwritten; use a new name for a new dataset.
dataset_name: sim_2k_super_easy_human
num_replicates: 1
num_samples: 8                 # Haplotypes; must be even. 8 = 4 diploid individuals.
population_size: 10000         # Effective diploid population size (Ne).
mutation_rate: 1.29e-8         # Per base per generation; JC69 mutation model.
recombination_rate: 1.253e-8    # Per base per generation.
sequence_length: 2000         # Integer number of bases.
seed: 42                      # Replicate i: ancestry seed + i*100000; mutations +1.
contig_id: "1"                # Contig label in the exported VCF.

output_dir: ../datasets        # Resolves to validation/datasets from this YAML file.

# Reference bases fill nonvariant FASTA positions; simulated mutations use JC69.
# Accepts plain FASTA or gzip FASTA (with a .gz suffix).
# A missing/empty reference is downloaded from reference_url (hg38 is large).
# Set reference_url: null to require an existing local reference instead.
reference_fasta: ../reference/hg38.fa.gz
reference_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz
reference_contig: chr1
reference_start: 10000000      # Zero-based offset; window spans sequence_length bases.
# Exported sequence/VCF coordinates are local to this window.
