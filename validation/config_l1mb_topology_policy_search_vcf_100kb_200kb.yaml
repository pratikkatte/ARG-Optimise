# Source-anchored topology-policy search selected by VCF likelihood only.
# Validation compares the exported topology candidates against tsinfer; SINGER
# is intentionally omitted.
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: VCF-learned topology policy [100kb,200kb)
    input_dir: ../runs/topology_policy_search_vcf_100kb_200kb/inference/region_100kb_200kb
    sample_prefix: arg_
    burnin_samples: 0
    max_posterior_samples: 16

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
