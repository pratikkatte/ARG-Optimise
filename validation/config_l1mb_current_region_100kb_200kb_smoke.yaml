# Exact-interval smoke comparison for the current learned local-refinement
# implementation on half-open interval [100000, 200000).
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: Current local refinement smoke [100kb,200kb)
    input_dir: ../runs/current_region_100kb_200kb_smoke/inference/region_100kb_200kb
    sample_prefix: arg_
    burnin_samples: 0
    max_posterior_samples: 8

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
