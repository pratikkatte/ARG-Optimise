# CwR-prior local refinement versus the existing 1 Mb baselines.
# Relative paths are resolved from this validation/ directory.
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: CwR prior refinement
    input_dir: ../runs/local_refinement_1mb/cwr_prior_samples/region_000001
    sample_prefix: arg_

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

  singer:
    label: SINGER posterior mean (99 valid samples)
    input_dir: output/singer/1mb
    sample_prefix: sim_l1mb_0_
    burnin_samples: 0
    max_posterior_samples: 99

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
