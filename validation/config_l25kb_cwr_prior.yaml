# Paths are relative to the validation/ directory.

truth:
  trees: trees/sim_l25kb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: CwR prior refinement
    input_dir: ../runs/local_refinement_25kb/cwr_prior_samples/region_000001
    sample_prefix: arg_

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l25kb_dated.trees

  singer:
    label: SINGER posterior mean
    input_dir: output/singer/l25kb_100_auto
    sample_prefix: singer__
    burnin_samples: 0
    max_posterior_samples: 100

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: true
