# One-replicate, whole-chromosome comparison for sim_l1mb_0.
# Relative paths are resolved from this validation/ directory.
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  # The reusable pipeline's "gfn" slot accepts any single locally generated
  # tree sequence. Here it is the likelihood-enabled local-refinement output.
  gfn:
    label: Refined ARG
    inferred_trees: output/tsinfer/l1mb_dated_local_refined.trees

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

  singer:
    label: SINGER (1 sample)
    input_dir: output/singer/l1mb
    sample_prefix: singer_
    burnin_samples: 0
    max_posterior_samples: 1

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
