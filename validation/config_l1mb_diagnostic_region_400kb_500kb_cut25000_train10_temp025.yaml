# Low-temperature inference-only comparison for the 10-epoch learned local
# refinement checkpoint on half-open interval [400000, 500000).
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: Learned local refinement cut25000 train10 temp0.25 [400kb,500kb)
    input_dir: ../runs/diagnostic_region_400kb_500kb_cut25000_train10_temp025/inference/region_400kb_500kb
    sample_prefix: arg_
    burnin_samples: 0
    max_posterior_samples: 16

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
