# Source-anchored VCF-distance topology-edit diagnostic for half-open interval
# [100000, 200000). This comparison intentionally uses only GFN/topology and
# tsinfer; SINGER is not needed for the baseline/refined comparison.
truth:
  trees: trees/sim_l1mb_0.trees
  ne: 10000
  haplotypes: 8

methods:
  gfn:
    label: VCF-distance topology edit [100kb,200kb)
    input_dir: ../runs/topology_vcf_distance_100kb_200kb_default/inference/region_100kb_200kb
    sample_prefix: arg_
    burnin_samples: 0
    max_posterior_samples: 1

  tsinfer:
    label: tsinfer+tsdate
    inferred_trees: output/tsinfer/l1mb_dated.trees

validation:
  skip: 1
  max_pairs: null
  pair_seed: 42
  xlim: [0, 16]
  ylim: [0, 8]
  xlim_log: [-4, 1.5]
  ylim_log: [-4, 1.5]
  verbose: false
