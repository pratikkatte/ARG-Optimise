data:
  dataset_path: validation/fasta/sim_poc_easy_0.fa
  output_path: outputs/example2_tb_stable
  bp_per_blocks: 50

runtime:
  device: auto
  seed: 7
  verbose: true

training:
  epochs: 1000
  batch_size: 16
  init_z_sample_count: 64
  grad_accum_steps: 4
  eval_episodes: 32
  eval_every: 5
  convergence_eval_episodes: 256
  convergence_eval_every: 25
  convergence_min_ess_fraction: 0.25
  convergence_max_abs_residual_mean: 1.0
  convergence_max_residual_rmse: 2.0
  convergence_required_passes: 3
  stop_on_convergence: true

optimizer:
  policy_lr: 0.0001
  log_z_lr: 0.05
  grad_clip: 10.0

environment:
  effective_population_size: 10000
  mutation_rate: 1.0e-7
  recombination_rate: 1.0e-8
  time_bins: 64
  time_delta_bin_width: 0.001
  reward_offset: 0.0

model:
  embedding_size: 64
  hidden_size: 128
  dropout: 0.1
  event_hidden_size: 128
  event_dropout: 0.1
  event_prior_weight: 0.1
  breakpoint_hidden_dim: 128
  breakpoint_dropout: 0.1
  transformer_depth: 4
  transformer_heads: 4
  transformer_mlp_ratio: 4.0
  attention_dropout: 0.1
  time_hidden_size: 256
  time_layers: 3
  time_dropout: 0.1
  breakpoint_gap_hidden_size: 256
  breakpoint_gap_layers: 3
  breakpoint_gap_dropout: 0.1
  breakpoint_use_position_features: true

logging:
  wandb: true
  project: arg-optimise
  entity: null
  run_name: null
