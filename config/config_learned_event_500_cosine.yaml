# Warm-start from the corrected sim_500 baseline at step 500 (3 evaluation repeats).
# Load policy/flow weights; use a fresh optimizer and restart the LR schedule at 0.
dataset_path: validation/datasets/sim_500/rep0/sim_500.fa
init_checkpoint: runs/sim_500_subtb_hudson_corrected_baseline_continuation_37714668/checkpoint_0500.pt
output_path: runs/sim_500_subtb_hudson_cosine_from_baseline_0500
# Additional updates after loading; includes the 500-update LR warm-up below.
epochs: 10000
batch_size: 128
seed: 7
verbose: true
wandb: true

event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 2.0
flow_head_version: 5
flow_lr: 0.001
policy_lr: 0.0001
lr_schedule: cosine
lr_schedule_steps: 10000
lr_warmup_steps: 500
lr_warmup_start_factor: 0.1
lr_min_factor: 0.1
flow_warmup_steps: 0
flow_warmup_episodes: 128
grad_clip: 10.0
grad_accum_steps: 1
init_z_sample_count: 200
eval_episodes: 256
eval_every: 50
terminal_eval: true
terminal_eval_grid_size: 100
terminal_eval_repeats: 3
terminal_eval_repeat_every: 250
tmrca_method: point_accuracy

arg_prior: hudson
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.0e-7
recombination_rate: 5.0e-8
time_policy: cwr_exponential
continuous_time_head: gamma
time_bins: 32
time_delta_bin_width: 0.001

embedding_size: 64
hidden_size: 128
dropout: 0.0
breakpoint_hidden_dim: 64
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_dropout: 0.1
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
attention_dropout: 0.0
