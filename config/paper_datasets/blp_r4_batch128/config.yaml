# R4: batch 128, lambda 0.9, auxiliary TB weight 0.25, and a fixed flow encoder.
# Cluster root matches the R2/R4 configs.
# python train.py --config config/paper_datasets/blp_r4_batch128/config.yaml
dataset_path: validation/datasets/paper_datasets/r4/rep0
resume_checkpoint: null
output_path: runs/paper_datasets_stable/blp_r4_lambda09_batch128_frozen_initial
device: cuda
cpu_threads: 8
max_events: 10000
epochs: 10000  # Cosine decay through update 6000, then retain the minimum LR.
max_wall_seconds: 169200
batch_size: 128
grad_accum_steps: 1  # One full batch of 128.
seed: 7
verbose: true
wandb: true
wandb_project: ARG-Optimise
wandb_name: blp_r4_lambda09_batch128_frozen_initial
wandb_mode: online

# SubTB + 0.25 * TB; retain R1's flow scaling and learning rates.
event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 0.9
tb_loss_weight: 0.25
flow_head_version: 6
flow_scale_mode: empirical
flow_lr: 0.001
policy_lr: 0.0001
encoder_lr: null
# The flow head always uses a frozen copy of the complete initial encoder.
# Policy encoder and flow head learn from update 1; the copy never changes.
flow_encoder_mode: frozen_initial
grad_clip: 10.0
flow_warmup_steps: 0
flow_warmup_episodes: 128
init_z_sample_count: 200
init_z_batch_size: 1

# Start R1's 6,000-update cosine schedule from update 1.
lr_schedule: cosine
lr_schedule_steps: 10000
lr_warmup_steps: 0
lr_warmup_start_factor: 0.1
lr_min_factor: 0.1

# Use R1's exploration/replay settings; the replay buffer starts empty.
exploration_fraction: 0.0
replay_fraction: 0.15
replay_capacity: 2048
replay_grid_size: 16
replay_per_topology: 4
replay_min_size: 128
policy_temperature_schedule: constant
policy_temperature_start: 1.0
policy_temperature_anneal_steps: 0

# Checkpoints and evaluation every 50 updates, including TMRCA truth metrics.
# As in R2/R4, a separate evaluator shares the training GPU.
checkpoint_every: 50
eval_every: 50
eval_async: true
eval_async_device: cuda
eval_async_shutdown_seconds: 1800
eval_episodes: 256
eval_batch_size: 16
eval_seed: 100007
eval_initial: false
eval_independent_likelihood: true
eval_density_slope: true
best_checkpoint_metric: eval_log_weight_std
terminal_eval: true
terminal_eval_grid_size: 100
terminal_eval_repeats: 3
terminal_eval_repeat_every: 50
tmrca_method: point_accuracy

# Original R4 scientific rates and complete observations.
arg_prior: hudson
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.0e-08
recombination_rate: 2.5e-09
reward_C: 3000.0
time_policy: cwr_exponential
continuous_time_head: gamma_mixture
time_mixture_components: 4
time_layers: 4
time_parameterization: legacy

# Preserve R1's six-layer architecture and feature representation.
embedding_size: 64
hidden_size: 128
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
dropout: 0.0
attention_dropout: 0.0
state_feature_transform: identity
initial_recombination_bias: 0.0
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_dropout: 0.0
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1

# Standalone analysis settings, separate from periodic evaluation above.
evaluation:
  checkpoint: best_eval
  metrics: [density_fit, ess, posterior_summary]
  num_samples: 1024
  repeats: 5
  batch_size: 32
  seed: 100007
  device: auto
  grid_size: 100
  rank_bins: 20
  bank_per_stratum: 64
  bank_candidates: 768
