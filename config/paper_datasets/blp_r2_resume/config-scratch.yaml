# r2 / original 25 kb rep0: continue the selected checkpoint at update 700.
# Run from /u/pratikkatte7/ARG-Optimise on the cluster in train.sbatch.blp.
# The launch script also passes the resume checkpoint explicitly.
dataset_path: validation/datasets/paper_datasets/r2/rep0
output_path: runs/paper_datasets_stable/blp_r2_lambda09_batch64_from_0
device: cuda
cpu_threads: 1
max_events: 10000
epochs: 10000  # Total update target; the next update is 701.
max_wall_seconds: 169200  # Stop training after 47 h within the 48 h allocation.
batch_size: 128
grad_accum_steps: 1  # One full batch of 64; no sequential microbatch split.
seed: 7
verbose: true
wandb: true
wandb_project: ARG-Optimise
wandb_name: blp_r2_lambda09_batch64_from_0
wandb_mode: online

# Match the saved training objective: SubTB + 0.25 * TB.
event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 0.9
tb_loss_weight: 0.25
flow_head_version: 6
flow_scale_mode: fixed
flow_lr: 0.0003
policy_lr: 0.0001
encoder_lr: 0.0001
flow_encoder_grad_scale: 0.1
grad_clip: 10.0
flow_warmup_steps: 0
flow_warmup_episodes: 128  # Inactive legacy field.
init_z_sample_count: 64  # Inherited; initialization is not repeated on resume.
init_z_batch_size: 16

# Restore optimizer moments and the existing 10,000-update cosine schedule.
# The 50-update LR warm-up already happened; it does not restart at update 701.
lr_schedule: cosine
lr_schedule_steps: 10000
lr_warmup_steps: 50
lr_warmup_start_factor: 0.1
lr_min_factor: 0.1

# Preserve checkpoint-700 exploration and replay settings/buffer.
exploration_fraction: 0.1
replay_fraction: 0.15
replay_capacity: 2048
replay_grid_size: 16
replay_per_topology: 4
replay_min_size: 128
policy_temperature_schedule: constant
policy_temperature_start: 1.0
policy_temperature_anneal_steps: 0

# Full resumable snapshots and a separate GPU evaluator every 50 updates.
# The evaluator shares the allocated GPU with training; it runs one request at a time.
checkpoint_every: 50
eval_every: 50
eval_async: true
eval_async_device: cuda
eval_async_shutdown_seconds: 1800  # Drain pending work after training ends, up to 30 min.
eval_episodes: 512
eval_batch_size: 32
eval_seed: 100007
eval_initial: false
eval_independent_likelihood: true
eval_density_slope: true
best_checkpoint_metric: eval_log_weight_std
terminal_eval: true  # Optional tree-truth summaries; ESS/density still run.
terminal_eval_grid_size: 100
terminal_eval_repeats: 3
terminal_eval_repeat_every: 1000
tmrca_method: point_accuracy

# Original r2 scientific rates and complete observations; no SNP thinning.
arg_prior: hudson
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.0e-08
recombination_rate: 5.0e-09
reward_C: 3000.0
time_policy: cwr_exponential
continuous_time_head: gamma_mixture
time_mixture_components: 4
time_layers: 4
time_parameterization: bounded_v1

# Exact compact architecture stored in checkpoint 700.
embedding_size: 64
hidden_size: 128
transformer_depth: 2
transformer_heads: 4
transformer_mlp_ratio: 2.0
dropout: 0.0
attention_dropout: 0.0
state_feature_transform: signed_log
initial_recombination_bias: -1.5
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_dropout: 0.0
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1

# Standalone analysis settings, separate from periodic evaluation above.
evaluation:
  checkpoint: best_eval
  metrics: [density_fit, ess, posterior_summary]
  num_samples: 1024
  repeats: 5
  batch_size: 32
  seed: 100007
  device: auto
  grid_size: 100
  rank_bins: 20
  bank_per_stratum: 64
  bank_candidates: 768
