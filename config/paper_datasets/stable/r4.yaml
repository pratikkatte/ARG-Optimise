# Stable timing, explicit source/terminal supervision, and metadata scientific rates.
dataset_path: validation/datasets/paper_datasets/r4/rep0
output_path: runs/paper_datasets_stable/r4_seed7
device: cuda
cpu_threads: 1
max_events: 10000
epochs: 10000
batch_size: 64
seed: 7
verbose: true
wandb: false
event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 1.0
flow_head_version: 6
flow_lr: 0.0003
policy_lr: 0.0001
flow_warmup_steps: 0
flow_warmup_episodes: 128
grad_clip: 10.0
grad_accum_steps: 4
init_z_sample_count: 64
init_z_batch_size: 16
lr_schedule: cosine
lr_schedule_steps: 10000
lr_warmup_steps: 250
lr_warmup_start_factor: 0.1
lr_min_factor: 0.1
exploration_fraction: 0.1
replay_fraction: 0.15
replay_capacity: 2048
replay_grid_size: 16
replay_per_topology: 4
replay_min_size: 128
policy_temperature_schedule: constant
policy_temperature_start: 1.0
policy_temperature_anneal_steps: 0
eval_episodes: 256
eval_batch_size: 32
eval_seed: 100007
eval_independent_likelihood: true
eval_every: 250
checkpoint_every: 250
eval_density_slope: true
terminal_eval: true
terminal_eval_grid_size: 100
terminal_eval_repeats: 3
terminal_eval_repeat_every: 1000
tmrca_method: point_accuracy
arg_prior: hudson
bp_per_blocks: 1
time_policy: cwr_exponential
continuous_time_head: gamma_mixture
time_mixture_components: 4
time_bins: 32
time_delta_bin_width: 0.001
embedding_size: 64
hidden_size: 128
dropout: 0.0
breakpoint_hidden_dim: 64
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_dropout: 0.0
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
attention_dropout: 0.0
evaluation:
  checkpoint: best_eval
  metrics:
  - density_fit
  - ess
  - posterior_summary
  num_samples: 1024
  repeats: 5
  batch_size: 32
  seed: 100007
  device: auto
  grid_size: 100
  rank_bins: 20
  bank_per_stratum: 64
  bank_candidates: 768
tb_loss_weight: 0.25
encoder_lr: 0.0001
flow_encoder_grad_scale: 0.1
flow_scale_mode: fixed
time_parameterization: bounded_v1
state_feature_transform: signed_log
eval_initial: true
best_checkpoint_metric: eval_log_weight_std
max_wall_seconds: 14000
