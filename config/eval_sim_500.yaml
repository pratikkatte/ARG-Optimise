# Standalone evaluation example using an existing archived run.
# python eval/eval.py --config config/eval_sim_500.yaml
dataset_path: validation/datasets/sim_500/rep0/sim_500.fa
output_path: runs/trash/sim_500_subtb_hudson_corrected_baseline
loss_type: subtb
evaluation:
  checkpoint: best_eval
  output_dir: validation/reports/standalone_eval_sim_500
  metrics: [density_fit, ess, posterior_summary]
  num_samples: 256
  repeats: 3
  batch_size: 32
  seed: 100007
  device: auto
  grid_size: 100
  bank_per_stratum: 64
  bank_candidates: 768
  # Set density_bank to reuse a bank produced in another output directory.
  # Omitted baselines are reported as unavailable, never launched automatically.
  baselines: {}
