dataset_path: validation/vcf/sim_l25kb_0.vcf
output_path: runs/local_refinement_25kb_v3
device: auto

refinement:
  enabled: true
  arg_path: validation/output/tsinfer/l25kb_dated.trees
  checkpoint: null
  requests:
    - id: region_000001
      genomic_range: [386, 23963]
      cut_time: 25000

training:
  epochs: 3000

  # Effective batch = 8 x 8 = 64
  batch_size: 8
  grad_accum_steps: 8

  seed: 7
  init_z_sample_count: 0
  verbose: false
  wandb: true

  policy_lr: 0.0003
  log_z_lr: 0.001
  loss: fl_subtb
  subtb_lambda: 0.9
  subtb_max_span: 16
  grad_clip: 10.0

  eval_episodes: 64
  eval_every: 20
  partial_segment_max_steps: 16
