# Fresh real-data training. Assumed rates match simulated R1, not inferred GBR rates.
# python train.py --config config/real_data/gbr_25kb.yaml
dataset_path: validation/datasets/paper_datasets/real_data/training_dataset
output_path: /private/groups/corbettlab/pratik/runs/real_data/gbr_25kb_v3
resume_checkpoint: null
device: cuda
cpu_threads: 8
seed: 7
epochs: 10000
max_wall_seconds: 169200
batch_size: 128
grad_accum_steps: 1
max_events: 10000
wandb: true
verbose: true

arg_prior: hudson
time_policy: cwr_exponential
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.0e-08
recombination_rate: 1.0e-08
reward_C: 3000.0

event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 0.9
tb_loss_weight: 0.25
flow_head_version: 6
flow_scale_mode: empirical
flow_encoder_mode: frozen_initial
policy_lr: 0.0001
flow_lr: 0.001
grad_clip: 10.0
init_z_sample_count: 200
init_z_batch_size: 1
lr_schedule: cosine
lr_schedule_steps: 6000
lr_min_factor: 0.1
exploration_fraction: 0.0
replay_fraction: 0.15
replay_capacity: 2048
replay_grid_size: 16
replay_per_topology: 4
replay_min_size: 128

checkpoint_every: 50
eval_every: 50
eval_episodes: 256
eval_batch_size: 16
eval_seed: 100007
eval_async: true
eval_async_device: cuda
eval_initial: false
eval_independent_likelihood: true
eval_density_slope: true
best_checkpoint_metric: eval_log_weight_std
# No true ARG exists for these observations. Never enable simulated-truth metrics.
terminal_eval: true

embedding_size: 64
hidden_size: 128
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
dropout: 0.0
attention_dropout: 0.0
state_feature_transform: identity
continuous_time_head: gamma_mixture
time_mixture_components: 4
time_layers: 4
time_parameterization: legacy
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1
breakpoint_dropout: 0.0
