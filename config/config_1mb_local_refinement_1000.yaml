# Long-run 1 Mb local-refinement training configuration.
# Uses the full breakpoint-aware time context and the separately tuned time-head
# learning rate. Retain intermediate checkpoints: the available seed-7 evidence
# peaked before the end of training, so the final epoch may not be the best one.

dataset_path: validation/vcf/sim_l1mb_0.vcf
output_path: runs/local_refinement_1mb_full_context_1000_terminal_requires_exhausted_fixed_schedule_true
device: cuda

refinement:
  enabled: true
  arg_path: validation/output/tsinfer/l1mb_dated.trees
  checkpoint: null
  terminal_requires_exhausted_fixed_schedule: true

  # Half-open 100 kb target interval [left, right).
  requests:
    - id: region_100kb_200kb
      genomic_range: [400000, 500000]
      cut_time: 25000

training:
  epochs: 1000

  # Effective batch size 16 with only one live trajectory per microbatch.
  # This is the memory-safe setting validated for the 1 Mb workflow.
  batch_size: 4
  grad_accum_steps: 4

  seed: 7
  init_z_sample_count: 0
  verbose: true
  wandb: true

  # Keep the structural policy conservative and train the continuous-time head
  # faster. A time LR of 1e-3 was stable; 1e-2 caused collapse in the ablation.
  policy_lr: 0.0001
  time_policy_lr: 0.001
  log_z_lr: 0.001

  loss: fl_subtb
  subtb_lambda: 0.9
  subtb_max_span: 16
  grad_clip: 10.0

  # Average enough held-out rollouts to reduce checkpoint-selection noise.
  # Evaluation seeds are controlled by the training code rather than YAML.
  eval_episodes: 32
  eval_every: 10
  partial_segment_max_steps: 16

environment:
  bp_per_blocks: 1
  effective_population_size: 10000
  mutation_rate: 2.0e-8
  recombination_rate: 2.0e-8

reward:
  constant: 0

model:
  embedding_size: 64
  hidden_size: 128
  dropout: 0.05

  breakpoint_hidden_dim: 128
  breakpoint_dropout: 0.05

  transformer_depth: 4
  transformer_heads: 4
  transformer_mlp_ratio: 2.0
  attention_dropout: 0.05

  time_basis_components: 16
  time_context_mode: full

  # Leave heuristic priors neutral so the GFlowNet learns from its reward.
  local_coalescence_similarity_bias: 0.0
  local_prior_action_logit_bias: 0.0
  local_prior_gate_logit_bias: 0.0
