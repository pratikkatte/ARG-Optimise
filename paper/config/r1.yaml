# python train.py --config paper/config/r1.yaml
dataset_path: paper/datasets/r1/rep0
resume_checkpoint: null
output_path: paper/checkpoints/r1/
device: cuda
cpu_threads: 8
max_events: 10000
epochs: 10000
max_wall_seconds: 169200
batch_size: 128
grad_accum_steps: 1
seed: 7
verbose: true
wandb: true
wandb_project: argflow
wandb_name: r1_run
wandb_mode: online

# SubTB + 0.25 * TB; retain R1's flow scaling and learning rates.
event_policy: cwr_residual
loss_type: subtb
subtb_lambda: 0.9
tb_loss_weight: 0.25
flow_head_version: 6
flow_scale_mode: empirical
flow_lr: 0.001
policy_lr: 0.0001
encoder_lr: null
flow_encoder_mode: frozen_initial
grad_clip: 10.0
flow_warmup_steps: 0
flow_warmup_episodes: 128
init_z_sample_count: 200
init_z_batch_size: 1

lr_schedule: cosine
lr_schedule_steps: 6000
lr_warmup_steps: 0
lr_warmup_start_factor: 0.1
lr_min_factor: 0.1

exploration_fraction: 0.0
replay_fraction: 0.15
replay_capacity: 2048
replay_grid_size: 16
replay_per_topology: 4
replay_min_size: 128
policy_temperature_schedule: constant
policy_temperature_start: 1.0
policy_temperature_anneal_steps: 0

checkpoint_every: 50
eval_every: 50
eval_async: true
eval_async_device: cuda
eval_async_shutdown_seconds: 1800
eval_episodes: 256
eval_batch_size: 16
eval_seed: 100007
eval_initial: false
eval_independent_likelihood: true
eval_density_slope: true
best_checkpoint_metric: eval_log_weight_std
terminal_eval: true
terminal_eval_grid_size: 100
terminal_eval_repeats: 3
terminal_eval_repeat_every: 50
tmrca_method: point_accuracy

# Original R1 scientific rates and complete observations.
arg_prior: hudson
bp_per_blocks: 1
effective_population_size: 10000
mutation_rate: 1.0e-08
recombination_rate: 1.0e-08
reward_C: 3000.0
time_policy: cwr_exponential
continuous_time_head: gamma_mixture
time_mixture_components: 4
time_layers: 4
time_parameterization: legacy

# Preserve R1's six-layer architecture and feature representation.
embedding_size: 64
hidden_size: 128
transformer_depth: 6
transformer_heads: 4
transformer_mlp_ratio: 2.0
dropout: 0.0
attention_dropout: 0.0
state_feature_transform: identity
initial_recombination_bias: 0.0
breakpoint_policy: sparse_mixture
breakpoint_mixture_hidden_dim: 128
breakpoint_mixture_layers: 4
breakpoint_mixture_components: 4
breakpoint_dropout: 0.0
breakpoint_gap_hidden_size: 64
breakpoint_gap_layers: 1

# Standalone analysis settings, separate from periodic evaluation above.
evaluation:
  checkpoint: best_eval
  metrics: [density_fit, ess, posterior_summary]
  num_samples: 1024
  repeats: 5
  batch_size: 32
  seed: 100007
  device: auto
  grid_size: 100
  rank_bins: 20
  bank_per_stratum: 64
  bank_candidates: 768
