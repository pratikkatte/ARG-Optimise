# Paths are relative to this repository root, regardless of the working directory.
output_dir: paper/outputs/evaluation
metrics:
  - pair_tmrca_rmse
  - rooted_rf
  - clade_brier
  - tmrca_coverage
  - tmrca_interval_width
credible_level: 0.90
# observed_union matches the old Section 5.1 table; fixed_universe uses 2^n-n-2.
# Both Brier scores are saved whenever clade_brier is enabled.
brier_normalization: fixed_universe
chunk_size: 64
expected_samples: 1800
verify_sample_hashes: true
figure2:
  output_dir: paper/outputs/figure_2
  methods: [ARGFlows, ARGInfer, SINGER]
  main_argflows_checkpoints:
    r1: r1_checkpoint_5650
    r2: checkpoint_4650
    r4: from1750_best_eval_step4300
  save_alternatives: false
  axis_limits_2Ne: [0.01, 10.0]
  bins: 80
  color_limits_percent: [0.001, 100.0]
  dpi: 300
figure3:
  output_dir: paper/outputs/figure_3
  methods: [ARGFlows, ARGInfer, SINGER]
  main_argflows_checkpoints:
    r1: r1_checkpoint_5650
    r2: checkpoint_4650
    r4: from1750_best_eval_step4300
  wasserstein_annotation: local_mean
  clade_normalization: fixed_universe
  chunk_size: 16
  density_bin_width_2Ne: 0.025
  density_bandwidth_2Ne: 0.10
  clade_bins: 25
  clade_color_limits_percent: [0.00001, 100.0]
  dpi: 300
datasets:
  r1:
    enabled: true
    dataset_dir: paper/datasets/r1/rep0
    sources:
      - method: ARGFlows
        format: argflow
        directory: paper/outputs/argflow/r1/r1_checkpoint_5650
      - method: SINGER
        format: singer
        directory: paper/outputs/SINGER/r1/trees
        input_dir: paper/datasets/r1/arginfer_inputs
        expected_samples: 1000
        unknown_time_units: generations
        burnin_samples: 0
      - method: ARGInfer
        format: arginfer
        directory: paper/outputs/ARGInfer/r1
        input_dir: paper/datasets/r1/arginfer_inputs
        expected_samples: 1800
        burnin_samples: 0
        expected_thin: 1000
  r2:
    enabled: true
    dataset_dir: paper/datasets/r2/rep0
    sources:
      - method: ARGFlows
        format: argflow
        directory: paper/outputs/argflow/r2/checkpoint_4650
      - method: SINGER
        format: singer
        directory: paper/outputs/SINGER/r2/trees
        input_dir: paper/datasets/r2/arginfer_inputs
        expected_samples: 1000
        unknown_time_units: generations
        burnin_samples: 0
      - method: ARGInfer
        format: arginfer
        directory: paper/outputs/ARGInfer/r2
        input_dir: paper/datasets/r2/arginfer_inputs
        expected_samples: 1800
        burnin_samples: 0
        expected_thin: 1000
  r4:
    enabled: true
    dataset_dir: paper/datasets/r4/rep0
    sources:
      - method: ARGFlows
        format: argflow
        directory: paper/outputs/argflow/r4/from1750_best_eval_step4300
      - method: SINGER
        format: singer
        directory: paper/outputs/SINGER/r4/trees
        input_dir: paper/datasets/r4/arginfer_inputs
        expected_samples: 1000
        unknown_time_units: generations
        burnin_samples: 0
      - method: ARGInfer
        format: arginfer
        directory: paper/outputs/ARGInfer/r4
        input_dir: paper/datasets/r4/arginfer_inputs
        expected_samples: 1800
        burnin_samples: 0
        expected_thin: 1000
